name: dsp

x-api-env: &api-env
  NODE_ENV: production
  PORT: 4000
  LOG_LEVEL: info
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
  DATABASE_URL: postgresql://dsp:dsp@postgres:5432/dsp?schema=public
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-please-change-me-32chars}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-please-change-me-32chars}
  JWT_ACCESS_TTL: 15m
  JWT_REFRESH_TTL: 30d
  S3_ENDPOINT: http://minio:9000
  # Hostname browsers and devices use to reach MinIO. Set to the machine's LAN IP to test on a phone or player.
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  S3_REGION: us-east-1
  S3_BUCKET: media
  S3_ACCESS_KEY: minio
  S3_SECRET_KEY: minio12345
  S3_FORCE_PATH_STYLE: "true"
  ONESIGNAL_APP_ID: ${ONESIGNAL_APP_ID:-}
  ONESIGNAL_API_KEY: ${ONESIGNAL_API_KEY:-}
  # Mail goes to Mailpit (inbox at http://localhost:8025) unless SMTP_URL points at a real relay.
  SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
  MAIL_FROM: ${MAIL_FROM:-Digital Signage <no-reply@localhost>}
  # Origin of the web app; password reset and invite links point here.
  APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dsp
      POSTGRES_PASSWORD: dsp
      POSTGRES_DB: dsp
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsp -d dsp"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 minio minio12345 &&
        mc mb --ignore-existing local/media &&
        mc anonymous set none local/media &&
        echo "bucket ready (private; media is served through presigned URLs only)"

  migrate:
    # Built from the stage that has the pinned Prisma CLI (a devDependency) installed.
    build: { context: .., dockerfile: docker/Dockerfile, target: migrate }
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
      # The seed uploads demo thumbnails, so the bucket must exist first.
      minio-init: { condition: service_completed_successfully }
    command: ["/bin/sh", "-c", "npx prisma migrate deploy && node dist/prisma/seed.js"]
    restart: "no"

  api:
    build: { context: .., dockerfile: docker/Dockerfile }
    environment: *api-env
    ports: ["4000:4000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    restart: unless-stopped

  worker:
    build: { context: .., dockerfile: docker/Dockerfile }
    environment: *api-env
    command: ["node", "dist/src/worker.js"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      mailpit: { condition: service_started }
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
