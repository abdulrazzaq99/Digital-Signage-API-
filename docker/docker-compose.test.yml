name: dsp-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dsp
      POSTGRES_PASSWORD: dsp
      POSTGRES_DB: dsp_test
    ports: ["5433:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsp -d dsp_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9003"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ["9002:9000", "9003:9003"]
    tmpfs: ["/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20
