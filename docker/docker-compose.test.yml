name: dsp-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dsp
      POSTGRES_PASSWORD: dsp
      POSTGRES_DB: dsp_test
    ports: ["5433:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsp -d dsp_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
