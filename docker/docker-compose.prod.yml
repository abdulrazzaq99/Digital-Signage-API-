# Single-server production: Postgres, Redis, API, worker and Caddy (HTTPS) on one host; media on S3.
# Run from the repo root: docker compose -f docker/docker-compose.prod.yml --env-file .env.production up -d --build
name: dsp

x-api-env: &api-env
  NODE_ENV: production
  PORT: 4000
  LOG_LEVEL: ${LOG_LEVEL:-info}
  CORS_ORIGINS: ${CORS_ORIGINS}
  DATABASE_URL: postgresql://dsp:${POSTGRES_PASSWORD}@postgres:5432/dsp?schema=public
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  JWT_ACCESS_TTL: 15m
  JWT_REFRESH_TTL: 30d
  # No S3 keys: the SDK uses the EC2 instance role.
  S3_ENDPOINT: https://s3.${S3_REGION}.amazonaws.com
  S3_REGION: ${S3_REGION}
  S3_BUCKET: ${S3_BUCKET}
  S3_FORCE_PATH_STYLE: "false"
  ONESIGNAL_APP_ID: ${ONESIGNAL_APP_ID:-}
  ONESIGNAL_API_KEY: ${ONESIGNAL_API_KEY:-}
  SMTP_URL: ${SMTP_URL:-}
  MAIL_FROM: ${MAIL_FROM:-Digital Signage <no-reply@localhost>}
  APP_PUBLIC_URL: ${APP_PUBLIC_URL}

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dsp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: dsp
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsp -d dsp"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    # BullMQ needs keys to survive restarts and never be evicted.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging

  migrate:
    build: { context: .., dockerfile: docker/Dockerfile, target: migrate }
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
    # Migrations only; the demo seed has known passwords and is run by hand if wanted.
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"

  api:
    build: { context: .., dockerfile: docker/Dockerfile }
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped
    logging: *logging

  worker:
    build: { context: .., dockerfile: docker/Dockerfile }
    environment: *api-env
    command: ["node", "dist/src/worker.js"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped
    logging: *logging

  caddy:
    image: caddy:2-alpine
    environment:
      API_HOST: ${API_HOST}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [api]
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  redisdata:
  caddydata:
